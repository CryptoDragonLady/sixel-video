[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sixel-video"
version = "0.1.0"
description = "Convert videos into streamable, compressed sixel animations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CryptoDragonLady"}]
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
sixel-video = "sixel_video.converter:main"

[project.urls]
Repository = "https://github.com/CryptoDragonLady/sixel-video"
Issues = "https://github.com/CryptoDragonLady/sixel-video/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sixel_video = ["*.pyx"]
